<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header & Dark Mode Toggle -->
        <header>
            <h1>Expense & Budget Visualizer</h1>
            <button id="themeToggleBtn" class="theme-btn">🌙 Dark Mode</button>
        </header>

        <!-- Total Balance Section -->
        <div class="card balance-card">
            <h2>TOTAL BALANCE</h2>
            <div id="totalBalance" class="balance-amount">$0.00</div>
        </div>

        <!-- Form Input Section -->
        <div class="card form-card">
            <h3>Add Transaction</h3>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" placeholder="Contoh: Cilok" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" placeholder="14.94" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Add Transaction</button>
            </form>
        </div>

        <!-- Dashboard Grid (List & Chart) -->
        <div class="dashboard-grid">
            <!-- Transaction List -->
            <div class="card list-card">
                <div class="list-header">
                    <h3>Transactions</h3>
                    <!-- Optional Challenge: Sort Filter -->
                    <select id="sortSelect">
                        <option value="default">Default</option>
                        <option value="amount-high">Amount: High to Low</option>
                        <option value="amount-low">Amount: Low to High</option>
                    </select>
                </div>
                <div id="transactionList" class="transaction-list">
                    <!-- List items akan di-render di sini secara dinamis -->
                </div>
            </div>

            <!-- Visual Chart -->
            <div class="card chart-card">
                <h3>Spending by Category</h3>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
